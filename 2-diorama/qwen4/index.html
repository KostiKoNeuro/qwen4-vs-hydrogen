function col(c){ return Array.isArray(c)? new THREE.Color(c[0],c[1],c[2]) : new THREE.Color(c); }
function push(list,x,y,z,sx,sy,sz,c,q){ list.push({p:new THREE.Vector3(x,y,z), s:new THREE.Vector3(sx,sy,sz), c:col(c), q:q||IDQ}); }

const LATIN = {
  B:["110","101","110","101","110"], Q:["111","101","101","111","001"],
  O:["111","101","101","101","111"], P:["110","101","110","100","100"],
  E:["111","100","110","100","111"], N:["101","111","111","101","101"],

  "2":["111","001","111","100","111"], "4":["101","101","111","001","001"],
  S:["011","100","010","001","110"], U:["101","101","101","101","111"],
  D:["110","101","101","101","110"], R:["110","101","110","101","101"],
  L:["100","100","100","100","111"], A:["010","101","111","101","101"],
  F:["111","100","110","100","100"], " ":["000","000","000","000","000"]
};
function latinRows(word){
  const rows=["","","","",""];
  for(const ch of word){ const g=LATIN[ch]||LATIN[" "]; for(let r=0;r<5;r++) rows[r]+=g[r]+"0"; }
  return rows;
}
function panel(rows, ox,oy,oz, R,U,N, color, cell=0.22, board=true){
  const h=rows.length, w=rows[0].length;
  const rv=new THREE.Vector3(...R), uv=new THREE.Vector3(...U), nv=new THREE.Vector3(...N);
  const q=new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(rv,uv,nv));
  const idx=[];
  if(board){
    const c=new THREE.Vector3(ox,oy,oz).addScaledVector(nv,-0.09);
    push(matteList,c.x,c.y,c.z,w*cell+0.28,h*cell+0.28,0.14,0x0c0e14,q);
  }
  for(let r=0;r<h;r++) for(let c=0;c<w;c++){
    if(rows[r][c]!=='1' && rows[r][c]!=='#') continue;
    const p=new THREE.Vector3(ox,oy,oz)
      .addScaledVector(rv,(c-(w-1)/2)*cell)
      .addScaledVector(uv,((h-1)/2-r)*cell)
      .addScaledVector(nv,0.03);
    idx.push(G(p.x,p.y,p.z,cell*0.92,cell*0.92,0.12,color,q));
  }
  return idx;
}
function vSign(x,y,z,chars,R,U,N,color,cell=0.24){
  const idx=[];
  chars.forEach((ch,i)=>{
    const rows=GLYPHS[ch]; if(!rows) return;
    const oy=y+(chars.length-1-i)*(rows.length*cell+0.3);
    idx.push(...panel(rows,x,oy,z,R,U,N,color,cell));
  });
  return idx;
}

function wire(p0,p1,sag,segments=12,color=0x0a0c10,thick=0.05){
  const pts=[];
  for(let i=0;i<=segments;i++){
    const t=i/segments;
    pts.push(new THREE.Vector3(
      p0[0]+(p1[0]-p0[0])*t,
      p0[1]+(p1[1]-p0[1])*t - sag*4*t*(1-t),
      p0[2]+(p1[2]-p0[2])*t));
  }
  const up=new THREE.Vector3(0,1,0);
  for(let i=0;i<segments;i++){
    const a=pts[i], b=pts[i+1], d=new THREE.Vector3().subVectors(b,a);
    const len=d.length(), mid=new THREE.Vector3().addVectors(a,b).multiplyScalar(0.5);
    const q=new THREE.Quaternion().setFromUnitVectors(up,d.normalize());
    push(matteList,mid.x,mid.y,mid.z,thick,len,thick,color,q);
  }
  return pts;
}

function personAnim(P,t,dt){
  const ph=P.phase, bob=P.bob;
  bob.position.y=0;
  P.legL.rotation.x=0; P.legR.rotation.x=0;
  P.armL.rotation.set(0,0,0.06); P.armR.rotation.set(0,0,-0.06);
  P.head.rotation.set(0,0,0);
  switch(P.type){
    case 'vendor':
      bob.position.y=0.02*Math.sin(t*2+ph);
      P.armR.rotation.x=-1.15+0.35*Math.sin(t*4+ph);
      P.armR.rotation.z=-0.3+0.25*Math.cos(t*4+ph);
      P.armL.rotation.x=-0.55;
      P.head.rotation.y=0.25*Math.sin(t*0.7+ph);
      P.root.rotation.x=0.05;
      break;
    case 'haggle':
      bob.position.y=0.03*Math.sin(t*2.6+ph);
      P.armR.rotation.x=-0.9+0.55*Math.sin(t*2.6+ph);
      P.armR.rotation.z=-0.25+0.2*Math.sin(t*1.9+ph);
      P.armL.rotation.x=-0.3+0.2*Math.sin(t*2.2+ph+1);
      P.head.rotation.y=0.2*Math.sin(t*1.1+ph);
      P.head.rotation.x=0.1*Math.sin(t*2.4+ph);
      break;
    case 'listen':
      bob.position.y=0.02*Math.sin(t*1.8+ph);
      P.armL.rotation.x=-0.5; P.armR.rotation.x=-0.5;
      P.head.rotation.x=0.14*Math.max(0,Math.sin(t*2.1+ph));
      break;
    case 'eat':
      bob.position.y=0.02*Math.sin(t*1.6+ph);
      P.armR.rotation.x=-1.9+0.55*Math.max(0,Math.sin(t*1.3+ph));
      P.armL.rotation.x=-0.7;
      P.head.rotation.x=0.12+0.08*Math.sin(t*1.3+ph);
      break;
    case 'point':
      bob.position.y=0.02*Math.sin(t*2+ph);
      P.armR.rotation.x=-1.35+0.18*Math.sin(t*2+ph);
      P.head.rotation.y=0.15*Math.sin(t*0.9+ph);
      break;
    case 'smoke':
      bob.position.y=0.02*Math.sin(t*1.4+ph);
      P.armR.rotation.x=-1.7+0.4*Math.max(0,Math.sin(t*0.6+ph));
      P.armL.rotation.x=-0.2;
      P.head.rotation.x=0.06*Math.sin(t*0.6+ph);
      break;
    case 'walk': case 'kid': {
      const sp=P.type==='kid'?2.3:1.15, span=P.type==='kid'?11:17;
      const cyc=(t*sp+ph*3)%(2*span);
      const dir=cyc<span?1:-1;
      P.root.position.x=dir>0?-span+cyc:span-(cyc-span);
      const target=dir>0?Math.PI/2:-Math.PI/2;
      let d=target-P.yaw; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;
      P.yaw+=d*Math.min(1,dt*5); P.root.rotation.y=P.yaw;
      const w=t*(P.type==='kid'?11:7)+ph;
      P.legL.rotation.x=0.6*Math.sin(w); P.legR.rotation.x=-0.6*Math.sin(w);
      P.armL.rotation.x=-0.5*Math.sin(w); P.armR.rotation.x=0.5*Math.sin(w);
      bob.position.y=0.05*Math.abs(Math.sin(w));
      break;
    }
    case 'ride':
      P.legL.rotation.x=-1.25; P.legR.rotation.x=-1.25;
      P.armL.rotation.x=-1.1; P.armR.rotation.x=-1.1;
      bob.position.y=0.01*Math.sin(t*9);
      break;
  }
}

    const y=e.y + e.vel*p.age*(1+0.2*Math.sin(p.seed));
    let sc=e.size*(0.4+1.4*k);
    if(k>0.65) sc*=1-(k-0.65)/0.35;
    _v.set(x,y,z); _sv.set(sc,sc,sc); _e.set(0,p.seed+t*0.4,0); _q.setFromEuler(_e);
    _m.compose(_v,_q,_sv);
    steamMesh.setMatrixAt(i,_m);
    i++;
  }
  steamMesh.instanceMatrix.needsUpdate=true;
}
function updateDrips(t,dt){
  let i=0;
  for(const d of drips){
    if(d.delay>0){ d.delay-=dt; _m.makeScale(0.001,0.001,0.001); }
    else {
      d.y-=9*dt;
      if(d.y<0.05){ d.y=4.2; d.x=rnd(-20,20); d.delay=rnd(0.5,5); }
      _v.set(d.x,d.y,d.z); _sv.set(0.05,0.22,0.05);
      _m.compose(_v,IDQ,_sv);
    }
    dripMesh.setMatrixAt(i,_m);
    i++;
  }
  dripMesh.instanceMatrix.needsUpdate=true;
}
const flickerBase=col([0.4,2.4,1.7]);
const _c=new THREE.Color();
function updateFlicker(t){
  const n=Math.sin(t*17)*Math.sin(t*3.7)+Math.sin(t*29)*0.3;
  const f=n>0.95?0.12:(0.82+0.18*Math.sin(t*31));
  _c.copy(flickerBase).multiplyScalar(f);
  for(const idx of flickerIdx) staticGlow.setColorAt(idx,_c);
  staticGlow.instanceColor.needsUpdate=true;
  for(const fg of fireGlows){
    const k=1.7+0.9*Math.abs(Math.sin(t*6+fg.phase))+0.3*Math.sin(t*23+fg.phase*3);
    _c.setRGB(k,k*0.34,k*0.06);
    dynGlow.setColorAt(fg.idx,_c);
  }
  const ek=1.5+1.5*Math.max(0,Math.sin(t*0.6+1));
  dynGlow.setColorAt(smokerEmber.userData.idx,_c.setRGB(ek,ek*0.3,ek*0.05));
  dynGlow.instanceColor.needsUpdate=true;
}
for(const fg of fireGlows){ const p=dynParts.find(q=>q.node===fg.n); fg.idx=p.idx; }
{ const p=dynParts.find(q=>q.node===smokerEmber); smokerEmber.userData.idx=p.idx; }

const clock=new THREE.Clock();
let simT=0, firstFrame=true;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  simT+=dt;
  for(const a of actors) a.update(simT,dt);
  scene.updateMatrixWorld(true);
  writeDyn();
  updateSteam(simT,dt);
  updateDrips(simT,dt);
  updateFlicker(simT);
  orbitState(simT);
  if(mode==='auto'){
    camera.position.copy(orbitPos);
    camera.lookAt(orbitTarget);
  } else if(mode==='free'){
    controls.update();
  } else {
    blendT+=dt/1.4;
    const k=blendT>=1?1:blendT*blendT*(3-2*blendT);
    _m4.lookAt(orbitPos,orbitTarget,camera.up);
    _q.setFromRotationMatrix(_m4);
    camera.position.lerpVectors(fromPos,orbitPos,k);
    camera.quaternion.slerpQuaternions(fromQuat,_q,k);
    if(blendT>=1) mode='auto';
  }
  composer.render();
  if(firstFrame){ firstFrame=false; renderer.domElement.style.opacity=1; }
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});
orbitState(0);
camera.position.copy(orbitPos);
camera.lookAt(orbitTarget);
animate();
</script>
