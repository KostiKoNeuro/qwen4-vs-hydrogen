const TAU = Math.PI * 2;

function hash3(x, y, z) {
  let n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453123;
  return n - Math.floor(n);
}

function createRng(seed = 1337) {
  let s = seed >>> 0;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

function jitterColor(hex, amt = 0.04, x = 0, y = 0, z = 0) {
  const c = new THREE.Color(hex);
  const h = hash3(Math.round(x * 20), Math.round(y * 20), Math.round(z * 20));
  const delta = (h - 0.5) * 2.0 * amt;
  c.offsetHSL(0, 0, delta);
  return c;
}

// 3. VOXEL BATCH BUILDER & CUSTOM SHADERS (VOXEL BEVEL + WET REFLECTIONS)
// ============================================================================
const sharedBoxGeo = new THREE.BoxGeometry(1, 1, 1);

class VoxelCollector {
  constructor() {
    this.items = [];
  }
  add(x, y, z, sx, sy, sz, color, extra = 0) {
    this.items.push({ x, y, z, sx, sy, sz, color: new THREE.Color(color), extra });
  }
  addCube(x, y, z, s, color, extra = 0) {
    this.add(x, y, z, s, s, s, color, extra);
  }
  // Fill an axis-aligned region strictly with discrete cubes of size `unit`
  fillCubes(x0, y0, z0, nx, ny, nz, unit, colorOrFn, { shellOnly = false, jitter = 0.03, extra = 0 } = {}) {
    for (let ix = 0; ix < nx; ix++) {
      for (let iy = 0; iy < ny; iy++) {
        for (let iz = 0; iz < nz; iz++) {
          if (shellOnly && ix > 0 && ix < nx - 1 && iy > 0 && iy < ny - 1 && iz > 0 && iz < nz - 1) {
            continue;
          }
          const cx = x0 + (ix + 0.5) * unit;
          const cy = y0 + (iy + 0.5) * unit;
          const cz = z0 + (iz + 0.5) * unit;
          const baseCol = typeof colorOrFn === 'function' ? colorOrFn(ix, iy, iz, cx, cy, cz) : colorOrFn;
          if (baseCol == null) continue;
          const col = jitter > 0 ? jitterColor(baseCol, jitter, cx, cy, cz) : new THREE.Color(baseCol);
          this.items.push({ x: cx, y: cy, z: cz, sx: unit, sy: unit, sz: unit, color: col, extra });
        }
      }
    }
  }
  buildInstancedMesh(material, { castShadow = true, receiveShadow = true, extraAttrName = null } = {}) {
    const count = this.items.length;
    if (count === 0) return null;
    const geo = sharedBoxGeo.clone();
    if (extraAttrName) {
      const arr = new Float32Array(count);
      for (let i = 0; i < count; i++) arr[i] = this.items[i].extra;
      geo.setAttribute(extraAttrName, new THREE.InstancedBufferAttribute(arr, 1));
    }
    const mesh = new THREE.InstancedMesh(geo, material, count);
    mesh.castShadow = castShadow;
    mesh.receiveShadow = receiveShadow;
    const dummy = new THREE.Object3D();
    for (let i = 0; i < count; i++) {
      const it = this.items[i];
      dummy.position.set(it.x, it.y, it.z);
      dummy.scale.set(it.sx, it.sy, it.sz);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
      mesh.setColorAt(i, it.color);
    }
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    return mesh;
  }
}

// Subtle voxel bevel & crevice shader so every individual cube is tactile and readable
function injectVoxelBevelShader(material, edgeDarkness = 0.10) {
  material.onBeforeCompile = (shader) => {
    shader.uniforms.uEdgeDark = { value: edgeDarkness };
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>
varying vec3 vVoxelLocalPos;
varying vec3 vVoxelLocalNormal;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
vVoxelLocalPos = position;
vVoxelLocalNormal = normal;`);

    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
uniform float uEdgeDark;
varying vec3 vVoxelLocalPos;
varying vec3 vVoxelLocalNormal;`)
      .replace('#include <color_fragment>', `#include <color_fragment>
vec3 absN = abs(vVoxelLocalNormal);
vec2 faceUV;
if (absN.y > 0.5) faceUV = vVoxelLocalPos.xz;
else if (absN.x > 0.5) faceUV = vVoxelLocalPos.zy;
else faceUV = vVoxelLocalPos.xy;
float edgeDist = min(0.5 - abs(faceUV.x), 0.5 - abs(faceUV.y));
float fw = max(fwidth(faceUV.x), fwidth(faceUV.y));
float edgeMask = 1.0 - smoothstep(0.02, max(0.055, fw * 1.35), edgeDist);
float fadeFar = 1.0 - smoothstep(0.08, 0.28, fw);
diffuseColor.rgb *= (1.0 - uEdgeDark * edgeMask * fadeFar);`);
  };
}

// Wet ground shader: real-time planar reflection + anisotropic wet streaks + animated puddle raindrop ripples
const wetUniforms = {
  uReflectTex: { value: reflectionRT.texture },
  uReflectMatrix: { value: reflectMatrix },
  uTime: { value: 0 },
  uCamPos: { value: new THREE.Vector3() },
  uReflectEnable: { value: 1.0 }
};

const wetGroundMat = new THREE.MeshStandardMaterial({
  roughness: 0.16,
  metalness: 0.22
});

wetGroundMat.onBeforeCompile = (shader) => {
  shader.uniforms.uReflectTex = wetUniforms.uReflectTex;
  shader.uniforms.uReflectMatrix = wetUniforms.uReflectMatrix;
  shader.uniforms.uTime = wetUniforms.uTime;
  shader.uniforms.uCamPos = wetUniforms.uCamPos;
  shader.uniforms.uReflectEnable = wetUniforms.uReflectEnable;

  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', `#include <common>
attribute float aWetType;
varying float vWetType;
varying vec3 vWetWorldPos;
varying vec3 vWetWorldNormal;
varying vec3 vWetLocalPos;`)
    .replace('#include <project_vertex>', `#include <project_vertex>
vec4 wp = vec4(transformed, 1.0);
#ifdef USE_INSTANCING
wp = instanceMatrix * wp;
#endif
wp = modelMatrix * wp;
vWetWorldPos = wp.xyz;
vec3 wn = objectNormal;
#ifdef USE_INSTANCING
wn = mat3(instanceMatrix) * wn;
#endif
vWetWorldNormal = normalize(mat3(modelMatrix) * wn);
vWetType = aWetType;
vWetLocalPos = position;`);

  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', `#include <common>
uniform sampler2D uReflectTex;
uniform mat4 uReflectMatrix;
uniform float uTime;
uniform vec3 uCamPos;
uniform float uReflectEnable;
varying float vWetType;
varying vec3 vWetWorldPos;
varying vec3 vWetWorldNormal;
varying vec3 vWetLocalPos;

float rippleRing(vec2 p, vec2 center, float tOffset, float period, out vec2 grad) {
  float age = fract((uTime + tOffset) / period);
  vec2 d = p - center;
  float dist = length(d);
  float radius = age * 1.45;
  float ring = exp(-pow((dist - radius) * 14.0, 2.0)) * (1.0 - age);
  float wave = sin((dist - radius) * 36.0) * ring;
  grad = dist > 0.001 ? (d / dist) * wave : vec2(0.0);
  return max(0.0, ring);
}`)
    .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
if (vWetWorldNormal.y > 0.5 && uReflectEnable > 0.01) {
  float isPuddle = step(0.5, vWetType);
  float isSidewalk = step(1.5, vWetType);
  vec3 samplePos = vec3(vWetWorldPos.x, isSidewalk > 0.5 ? vWetWorldPos.y - 0.22 : 0.0, vWetWorldPos.z);
  vec4 rClip = uReflectMatrix * vec4(samplePos, 1.0);
  vec2 rUV = (rClip.xy / max(rClip.w, 0.0001)) * 0.5 + 0.5;

  vec2 rippleGrad = vec2(0.0);
  float rippleSpark = 0.0;
  if (isPuddle > 0.5 && isSidewalk < 0.5) {
    vec2 g;
    rippleSpark += rippleRing(vWetWorldPos.xz, vec2(-9.5, -1.6), 0.2, 2.5, g); rippleGrad += g;
    rippleSpark += rippleRing(vWetWorldPos.xz, vec2(-2.2, 0.8), 1.1, 3.0, g); rippleGrad += g;
    rippleSpark += rippleRing(vWetWorldPos.xz, vec2(4.4, -1.1), 0.7, 2.5, g); rippleGrad += g;
    rippleSpark += rippleRing(vWetWorldPos.xz, vec2(10.8, 1.2), 2.1, 3.0, g); rippleGrad += g;
    rippleSpark += rippleRing(vWetWorldPos.xz, vec2(-14.2, 0.4), 1.6, 2.5, g); rippleGrad += g;
    rippleSpark += rippleRing(vWetWorldPos.xz, vec2(0.6, -2.0), 0.4, 3.0, g); rippleGrad += g;
  }

  vec2 uv = rUV + rippleGrad * 0.014;
  float inBounds = step(0.002, uv.x) * step(uv.x, 0.998) * step(0.002, uv.y) * step(uv.y, 0.998);
  vec3 reflColor = vec3(0.0);
  if (inBounds > 0.5) {
    if (isPuddle > 0.5 && isSidewalk < 0.5) {
      // Crisp water mirror in puddles
      reflColor = texture2D(uReflectTex, uv).rgb * 0.82
                + texture2D(uReflectTex, uv + vec2(0.0018, 0.0018)).rgb * 0.09
                + texture2D(uReflectTex, uv - vec2(0.0018, 0.0018)).rgb * 0.09;
    } else {
      // Anisotropic vertically-streaked reflections on wet asphalt & wet tiles
      float spread = isSidewalk > 0.5 ? 0.013 : 0.009;
      vec3 acc = vec3(0.0);
      acc += texture2D(uReflectTex, clamp(uv + vec2(-spread * 0.3, -spread * 2.2), 0.002, 0.998)).rgb * 0.14;
      acc += texture2D(uReflectTex, clamp(uv + vec2(0.0, -spread * 1.1), 0.002, 0.998)).rgb * 0.22;
      acc += texture2D(uReflectTex, uv).rgb * 0.28;
      acc += texture2D(uReflectTex, clamp(uv + vec2(0.0, spread * 1.1), 0.002, 0.998)).rgb * 0.22;
      acc += texture2D(uReflectTex, clamp(uv + vec2(spread * 0.3, spread * 2.2), 0.002, 0.998)).rgb * 0.14;
      reflColor = acc;
    }
  }

  vec3 viewDir = normalize(uCamPos - vWetWorldPos);
  float fresnel = pow(1.0 - max(dot(normalize(vWetWorldNormal), viewDir), 0.0), 3.0);
  float waterFactor = isPuddle > 0.5 && isSidewalk < 0.5 ? mix(0.55, 0.96, fresnel)
                    : (isSidewalk > 0.5 ? mix(0.14, 0.42, fresnel) : mix(0.24, 0.62, fresnel));

  // Subtle tile seam on wet cubes
  float edgeD = min(0.5 - abs(vWetLocalPos.x), 0.5 - abs(vWetLocalPos.z));
  float seam = 1.0 - 0.16 * (1.0 - smoothstep(0.015, 0.045, edgeD));

  totalEmissiveRadiance += reflColor * waterFactor * uReflectEnable * seam;
  totalEmissiveRadiance += vec3(0.22, 0.36, 0.52) * rippleSpark * 0.35;
}`);
};

// Draw Chinese voxel neon sign (backplate + glowing voxel glyphs + optional neon frame)
function addVoxelNeonSign({
  text,
  x, y, z,
  facing = 'z+', // 'z+', 'z-', 'x+', 'x-'
  vertical = false,
  pixel = 0.095,
  fgColor = 0xff2a85,
  fgIntensity = 2.6,
  bgColor = 0x101320,
  frameColor = 0x00e5ff,
  frameIntensity = 2.0,
  charGap = 2
}) {
  const chars = Array.isArray(text) ? text : [...text];
  const glyphW = 9;
  const glyphH = 9;
  const cols = vertical ? glyphW : chars.length * glyphW + (chars.length - 1) * charGap;
  const rows = vertical ? chars.length * glyphH + (chars.length - 1) * charGap : glyphH;
  const pad = 2;
  const totalW = (cols + pad * 2) * pixel;
  const totalH = (rows + pad * 2) * pixel;
  const depth = pixel * 1.4;

  // Helper converting sign-local (u, v, d) to world coordinates
  const toWorld = (u, v, d) => {
    if (facing === 'z+') return [x + u, y + v, z + d];
    if (facing === 'z-') return [x - u, y + v, z - d];
    if (facing === 'x+') return [x + d, y + v, z - u];
    return [x - d, y + v, z + u];
  };

  // Sign backing box made of dark metal cubes
  const bwCount = cols + pad * 2;
  const bhCount = rows + pad * 2;
  for (let ix = 0; ix < bwCount; ix++) {
    for (let iy = 0; iy < bhCount; iy++) {
      const u = (ix - (bwCount - 1) / 2) * pixel;
      const v = ((bhCount - 1) / 2 - iy) * pixel;
      const [wx, wy, wz] = toWorld(u, v, 0);
      const isEdge = ix === 0 || ix === bwCount - 1 || iy === 0 || iy === bhCount - 1;
      if (isEdge && frameColor != null) {
        const fc = new THREE.Color(frameColor).multiplyScalar(frameIntensity);
        const [fx, fy, fz] = toWorld(u, v, pixel * 0.55);
        emissiveCol.addCube(fx, fy, fz, pixel * 0.92, fc);
        // Back side of double-sided blade signs
        if (facing === 'x+' || facing === 'x-') {
          const [bx, by, bz] = toWorld(u, v, -pixel * 0.55);
          emissiveCol.addCube(bx, by, bz, pixel * 0.92, fc);
        }
      }
      metalCol.addCube(wx, wy, wz, pixel * 1.02, jitterColor(bgColor, 0.02, wx, wy, wz));
    }
  }

  // Render voxel characters onto front (and back for blade signs!)
  const fgCol = new THREE.Color(fgColor).multiplyScalar(fgIntensity);
  const doubleSided = facing === 'x+' || facing === 'x-';

  chars.forEach((ch, idx) => {
    const bmp = GLYPHS[ch] || GLYPHS['市'];
    const rowsLen = bmp.length;
    const colsLen = bmp[0].length;
    const baseCol = vertical ? pad : pad + idx * (glyphW + charGap);
    const baseRow = vertical ? pad + idx * (glyphH + charGap) : pad;

    for (let r = 0; r < rowsLen; r++) {
      for (let c = 0; c < colsLen; c++) {
        if (bmp[r][c] !== '#') continue;
        const gx = baseCol + c + Math.floor((glyphW - colsLen) / 2);
        const gy = baseRow + r;
        const u = (gx - (bwCount - 1) / 2) * pixel;
        const v = ((bhCount - 1) / 2 - gy) * pixel;
        const [wx, wy, wz] = toWorld(u, v, depth * 0.65);
        emissiveCol.addCube(wx, wy, wz, pixel * 0.96, fgCol);
        if (doubleSided) {
          // Flip horizontal axis (-u) on back face so characters read forward from BOTH directions!
          const [bx, by, bz] = toWorld(-u, v, -depth * 0.65);
          emissiveCol.addCube(bx, by, bz, pixel * 0.96, fgCol);
        }
      }
    }
  });

  return { width: totalW, height: totalH };
}

// Overhead sagging catenary wire built purely out of tiny voxel cubes
function addVoxelWire(p1, p2, sag = 0.65, cubeSize = 0.055, color = 0x10131a, stepDist = 0.052) {
  const a = new THREE.Vector3(...p1);
  const b = new THREE.Vector3(...p2);
  const dist = a.distanceTo(b);
  const steps = Math.max(8, Math.ceil(dist / stepDist));
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const p = new THREE.Vector3().lerpVectors(a, b, t);
    p.y -= Math.sin(t * Math.PI) * sag;
    matteCol.addCube(p.x, p.y, p.z, cubeSize, color);
  }
}

function addVoxelLanternString(p1, p2, count = 6, sag = 0.55, scale = 0.95) {
  addVoxelWire(p1, p2, sag, 0.04, 0x16161c, 0.045);
  const a = new THREE.Vector3(...p1);
  const b = new THREE.Vector3(...p2);
  for (let i = 1; i <= count; i++) {
    const t = i / (count + 1);
    const p = new THREE.Vector3().lerpVectors(a, b, t);
    p.y -= Math.sin(t * Math.PI) * sag;
    const col = i % 3 === 0 ? 0xff4518 : 0xff2214;
    createVoxelLantern(p.x, p.y, p.z, scale, i * 0.7 + a.x * 0.2, col);
  }
}

function buildDioramaPlinthAndStreet() {
  // Cutaway diorama plinth (x: -20.5..20.5, z: -13.0..9.5, y: -2.2..0.0)
  // Rendered ONLY in main camera pass (excluded from reflection pass!)
  const pX0 = -20.5, pZ0 = -13.0;
  const nx = 82, nz = 45;
  const u = 0.5;

  // Deep cutaway soil/bedrock layer + crisp architectural concrete collar
  for (let ix = 0; ix < nx; ix++) {
    for (let iz = 0; iz < nz; iz++) {
      const isBorder = ix === 0 || ix === nx - 1 || iz === 0 || iz === nz - 1;
      const cx = pX0 + (ix + 0.5) * u;
      const cz = pZ0 + (iz + 0.5) * u;
      if (isBorder) {
        plinthCol.addCube(cx, -0.22, cz, u, jitterColor(0x3a4358, 0.025, cx, -0.2, cz));
        plinthCol.addCube(cx, -0.72, cz, u, jitterColor(0x282f40, 0.03, cx, -0.7, cz));
        plinthCol.addCube(cx, -1.22, cz, u, jitterColor(0x1d2230, 0.03, cx, -1.2, cz));
        plinthCol.addCube(cx, -1.72, cz, u, jitterColor(0x141822, 0.02, cx, -1.7, cz));
      } else if (ix === 1 || ix === nx - 2 || iz === 1 || iz === nz - 2) {
        plinthCol.addCube(cx, -0.25, cz, u, jitterColor(0x232938, 0.02, cx, -0.25, cz));
      }
    }
  }
  // Solid bottom cap of the cutaway slab so underneath looks crisp when orbited
  plinthCol.fillCubes(-20.5, -1.97, -13.0, 41, 1, 22, 1.0, 0x11151f, { jitter: 0.015 });
  // Cutaway sewer pipes & glowing fiber conduit visible on West, East & South cross-section edges!
  for (const px of [-20.55, 20.55]) {
    for (const pz of [-1.4, 1.4]) {
      metalCol.addCube(px, -0.85, pz, 0.52, 0x3b495e);
      matteCol.addCube(px + (px < 0 ? -0.04 : 0.04), -0.85, pz, 0.30, 0x070a10);
    }
  }
  for (const sx of [-10.0, 0.0, 10.0]) {
    metalCol.addCube(sx, -0.85, 9.55, 0.42, 0x3b495e);
    emissiveCol.addCube(sx + 0.55, -0.85, 9.54, 0.14, new THREE.Color(0x28d6ff).multiplyScalar(1.6));
  }

  // Wet Asphalt Road (x: -20..20, z: -3.25..3.25) using 0.25 cubes with top face at y = 0.0
  // Extra attribute aWetType: 0 = wet asphalt, 1 = puddle mirror, 2 = wet sidewalk tile
  const rUnit = 0.25;
  const puddles = [
    { cx: -14.2, cz: 0.4, rx: 2.3, rz: 1.3 },
    { cx: -9.5, cz: -1.6, rx: 2.6, rz: 1.1 },
    { cx: -5.2, cz: 1.4, rx: 1.9, rz: 0.9 },
    { cx: -2.2, cz: 0.7, rx: 2.7, rz: 1.3 },
    { cx: 0.6, cz: -2.0, rx: 2.2, rz: 1.0 },
    { cx: 4.4, cz: -1.1, rx: 2.5, rz: 1.2 },
    { cx: 7.4, cz: 1.5, rx: 2.1, rz: 0.95 },
    { cx: 10.8, cz: 1.1, rx: 2.6, rz: 1.2 },
    { cx: 14.8, cz: -1.4, rx: 2.3, rz: 1.1 },
    { cx: -17.5, cz: -0.9, rx: 2.0, rz: 1.1 }
  ];

  const isInPuddle = (wx, wz) => {
    for (const p of puddles) {
      const dx = (wx - p.cx) / p.rx;
      const dz = (wz - p.cz) / p.rz;
      const wobble = 0.18 * Math.sin(wx * 2.1 + wz * 1.7) + 0.12 * Math.cos(wx * 3.4 - wz * 2.9);
      if (dx * dx + dz * dz + wobble < 1.0) return true;
    }
    return false;
  };

  for (let wx = -20 + rUnit * 0.5; wx < 20; wx += rUnit) {
    for (let wz = -3.25 + rUnit * 0.5; wz < 3.25; wz += rUnit) {
      // Asphalt tile: top at y = 0.0
      const asphaltCol = jitterColor(0x111520, 0.018, wx, 0, wz);
      wetGroundCol.add(wx, -0.08, wz, rUnit, 0.16, rUnit, asphaltCol, 0);

      // Puddle sheet slightly proud at top y = 0.014
      if (isInPuddle(wx, wz)) {
        wetGroundCol.add(wx, 0.007, wz, rUnit, 0.014, rUnit, 0x090d16, 1);
      }
    }
  }

  // Faded yellow double centerline + white zebra crossing at West archway
  for (let wx = -15.5; wx <= 18.5; wx += 0.25) {
    if (Math.floor((wx + 20) * 1.2) % 3 !== 2) {
      matteCol.add(wx, 0.008, -0.09, 0.23, 0.016, 0.08, jitterColor(0x8c6d1f, 0.03, wx, 0, 0));
      matteCol.add(wx, 0.008, 0.09, 0.23, 0.016, 0.08, jitterColor(0x8c6d1f, 0.03, wx, 0, 1));
    }
  }
  // Crosswalk stripes near West entrance (x = -16.8)
  for (let wz = -2.4; wz <= 2.4; wz += 0.8) {
    for (let wx = -17.3; wx <= -16.2; wx += 0.25) {
      matteCol.add(wx, 0.009, wz, 0.23, 0.016, 0.36, jitterColor(0x7c8598, 0.03, wx, 0, wz));
    }
  }

  // Metal storm-drain grates along curbs
  for (const gx of [-12.5, -4.5, 3.5, 11.5]) {
    for (const gz of [-3.05, 3.05]) {
      for (let i = -2; i <= 2; i++) {
        metalCol.add(gx + i * 0.14, 0.015, gz, 0.07, 0.03, 0.38, 0x262d3a);
      }
      matteCol.add(gx, -0.01, gz, 0.75, 0.03, 0.38, 0x050608);
    }
  }

  // Raised Wet Sidewalks (North: z = -5.5..-3.25, South: z = 3.25..5.5), top surface y = 0.22
  const swUnit = 0.25;
  for (let wx = -20 + swUnit * 0.5; wx < 20; wx += swUnit) {
    for (const side of [-1, 1]) {
      const zStart = side < 0 ? -5.5 + swUnit * 0.5 : 3.25 + swUnit * 0.5;
      const zEnd = side < 0 ? -3.25 : 5.5;
      for (let wz = zStart; wz < zEnd; wz += swUnit) {
        const isCurb = Math.abs(wz) < 3.52;
        const isTactileYellow = Math.abs(Math.abs(wz) - 3.85) < 0.14;
        let col = 0x262a35;
        if (isCurb) col = (Math.floor((wx + 20) * 1.0) % 2 === 0) ? 0x343946 : 0x252933;
        else if (isTactileYellow) col = 0x6b5a22;
        else col = ((Math.floor(wx * 4) + Math.floor(wz * 4)) % 2 === 0) ? 0x2b2d38 : 0x242630;
        wetGroundCol.add(wx, 0.11, wz, swUnit, 0.22, swUnit, jitterColor(col, 0.025, wx, 0.2, wz), 2);
      }
    }
  }

  // Base floor under North & South buildings so nothing floats
  matteCol.fillCubes(-20.0, 0.0, -12.8, 40, 1, 14, 0.5, 0x1a1f2b, { jitter: 0.02 });
  matteCol.fillCubes(-20.0, 0.0, 5.5, 40, 1, 8, 0.5, 0x1d2230, { jitter: 0.02 });
}

// 6. SHENZHEN URBAN VILLAGE BUILDINGS (NORTH TOWERS + SOUTH SHOPHOUSES)
// ============================================================================
function buildVoxelBuilding({
  x0, z0, w, d, h,
  wallColor, trimColor, tileUnit = 0.5,
  frontFace = 'z+', // facing toward the street
  hasBalconies = true,
  hasAC = true,
  hasLaundry = false,
  rng
}) {
  const nx = Math.round(w / tileUnit);
  const ny = Math.round(h / tileUnit);
  const nz = Math.round(d / tileUnit);

  // Exterior shell of building tiles
  matteCol.fillCubes(x0, 0.2, z0, nx, ny, nz, tileUnit, (ix, iy, iz) => {
    if (iy === ny - 1) return 0x20242e; // dark wet roof parapet
    if (iy === 0 || iy === Math.round(3.6 / tileUnit)) return trimColor;
    // Classic Shenzhen tiny square mosaic facade rhythm
    if (iy % 2 === 0 && (ix + iz) % 3 === 0) return new THREE.Color(wallColor).offsetHSL(0, 0, -0.025);
    return wallColor;
  }, { shellOnly: true, jitter: 0.025 });

  // Windows & security grilles along street-facing wall (upper stories y >= 3.8)
  const frontZ = frontFace === 'z+' ? z0 + d : z0;
  const outSign = frontFace === 'z+' ? 1 : -1;
  const floors = Math.floor((h - 3.8) / 2.9);

  for (let f = 0; f < floors; f++) {
    const wy = 4.5 + f * 2.9;
    const winCount = Math.max(1, Math.floor((w - 1.2) / 2.2));
    for (let wi = 0; wi < winCount; wi++) {
      const wx = x0 + 1.3 + wi * ((w - 2.6) / Math.max(1, winCount - 1 || 1));
      const lit = rng() < 0.62;
      const warm = rng() < 0.72;
      const winCol = lit
        ? new THREE.Color(warm ? 0xffc670 : 0x8de2ff).multiplyScalar(warm ? 1.15 : 1.05)
        : new THREE.Color(0x0b1220);

      // Window frame
      matteCol.add(wx, wy, frontZ + outSign * 0.04, 1.1, 1.3, 0.12, 0x1a1e28);
      // Window glass voxels (split by muntin bar)
      for (const dx of [-0.26, 0.26]) {
        for (const dy of [-0.28, 0.28]) {
          if (lit) {
            emissiveCol.add(wx + dx, wy + dy, frontZ + outSign * 0.08, 0.42, 0.48, 0.06, winCol);
          } else {
            metalCol.add(wx + dx, wy + dy, frontZ + outSign * 0.08, 0.42, 0.48, 0.06, winCol);
          }
        }
      }

      // Security cage bars (防盗网)
      if (hasBalconies && rng() < 0.75) {
        const cageZ = frontZ + outSign * 0.24;
        for (let bx = -0.5; bx <= 0.5; bx += 0.25) {
          metalCol.add(wx + bx, wy - 0.1, cageZ, 0.04, 1.1, 0.04, 0x525a6a);
        }
        metalCol.add(wx, wy - 0.65, frontZ + outSign * 0.14, 1.15, 0.06, 0.26, 0x454d5c);
        metalCol.add(wx, wy + 0.45, frontZ + outSign * 0.14, 1.15, 0.05, 0.26, 0x454d5c);
      }

      // External AC Condenser box with animated voxel fan
      if (hasAC && rng() < 0.55) {
        const acX = wx + 0.85;
        const acY = wy - 0.35;
        const acZ = frontZ + outSign * 0.24;
        if (acX < x0 + w - 0.6) {
          matteCol.add(acX, acY, acZ, 0.62, 0.44, 0.36, 0xadb4c2);
          matteCol.add(acX - 0.12, acY, acZ + outSign * 0.16, 0.3, 0.3, 0.06, 0x1a1e26);
          // Spinning fan cross
          const fan = new THREE.Group();
          fan.position.set(acX - 0.12, acY, acZ + outSign * 0.19);
          const b1 = new THREE.Mesh(sharedBoxGeo, metalMat);
          b1.scale.set(0.24, 0.045, 0.03);
          const b2 = new THREE.Mesh(sharedBoxGeo, metalMat);
          b2.scale.set(0.045, 0.24, 0.03);
          fan.add(b1, b2);
          scene.add(fan);
          animatedFans.push({ group: fan, speed: 6 + Math.floor(rng() * 5) });
        }
      }

      // Hanging laundry pole on upper floors
      if (hasLaundry && f >= 0 && rng() < 0.45) {
        const lz = frontZ + outSign * 0.48;
        metalCol.add(wx, wy - 0.15, lz, 1.35, 0.04, 0.04, 0x9aa2b2);
        const shirtCols = [0xd94858, 0x3b82d6, 0xe8e4d8, 0xf0b23a, 0x54b878];
        for (let ci = -1; ci <= 1; ci++) {
          if (rng() < 0.75) {
            const sc = shirtCols[Math.floor(rng() * shirtCols.length)];
            matteCol.add(wx + ci * 0.38, wy - 0.38, lz, 0.28, 0.42, 0.06, sc);
          }
        }
      }
    }
  }

  // Rooftop water tank + pipe stack + antennas + rooftop potted plants
  if (h > 6.5) {
    const tx = x0 + w * 0.35;
    const tz = z0 + d * 0.5;
    metalCol.add(tx, h + 0.8, tz, 1.2, 1.3, 1.2, 0x9aa6ba);
    metalCol.add(tx - 0.4, h + 0.2, tz - 0.4, 0.14, 0.6, 0.14, 0x454f5e);
    metalCol.add(tx + 0.4, h + 0.2, tz + 0.4, 0.14, 0.6, 0.14, 0x454f5e);
    // TV / cellular rooftop antenna mast + tiny red aviation beacon!
    const ax = x0 + w * 0.78;
    const az = z0 + d * 0.35;
    metalCol.add(ax, h + 1.1, az, 0.08, 1.9, 0.08, 0x7c8799);
    metalCol.add(ax, h + 1.6, az, 0.65, 0.06, 0.06, 0x7c8799);
    emissiveCol.addCube(ax, h + 2.08, az, 0.10, new THREE.Color(0xff2b2b).multiplyScalar(2.4));
    // Rooftop skylight / shed hatch
    matteCol.add(x0 + w * 0.62, h + 0.45, z0 + d * 0.65, 1.4, 0.85, 1.3, 0x2e3545);
  } else {
    // Low South market shophouses: tiled rooftop AC, solar heater or flowerpots
    matteCol.add(x0 + w * 0.3, h + 0.35, z0 + d * 0.5, 0.65, 0.42, 0.42, 0x9aa4b5);
    matteCol.add(x0 + w * 0.72, h + 0.32, z0 + d * 0.45, 0.45, 0.36, 0.45, 0x733c2a);
    matteCol.addCube(x0 + w * 0.72, h + 0.65, z0 + d * 0.45, 0.34, 0x2f8545);
  }

  // Exterior vertical PVC drain pipes down wall
  const pipeX = x0 + 0.35;
  metalCol.add(pipeX, h * 0.5, frontZ + outSign * 0.08, 0.14, h - 0.4, 0.14, 0x363d4a);
}

function addAwning(x0, z0, w, d, yHigh, yLow, slopeDirZ, stripeA, stripeB) {
  const u = 0.25;
  const nx = Math.round(w / u);
  const nz = Math.round(d / u);
  for (let ix = 0; ix < nx; ix++) {
    const col = Math.floor(ix / 2) % 2 === 0 ? stripeA : stripeB;
    for (let iz = 0; iz < nz; iz++) {
      const frac = slopeDirZ > 0 ? iz / (nz - 1) : 1 - iz / (nz - 1);
      const y = THREE.MathUtils.lerp(yHigh, yLow, frac);
      const wx = x0 + (ix + 0.5) * u;
      const wz = z0 + (iz + 0.5) * u;
      matteCol.add(wx, y, wz, u, 0.08, u, jitterColor(col, 0.03, wx, y, wz));
    }
  }
  // Steel support poles at outer corners
  const outerZ = slopeDirZ > 0 ? z0 + d - 0.12 : z0 + 0.12;
  for (const px of [x0 + 0.14, x0 + w - 0.14]) {
    metalCol.add(px, (yLow + 0.22) * 0.5, outerZ, 0.08, yLow - 0.22, 0.08, 0x677285);
  }
}

function buildVoxelScooterModel({ bodyColor = 0x2675d9, hasDeliveryBox = false, isOn = true } = {}) {
  const g = new THREE.Group();
  const bodyM = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.32, metalness: 0.25 });
  const darkM = new THREE.MeshStandardMaterial({ color: 0x161922, roughness: 0.85 });
  const chromeM = new THREE.MeshStandardMaterial({ color: 0x9aa4b5, roughness: 0.25, metalness: 0.75 });

  const addPart = (px, py, pz, sx, sy, sz, mat) => {
    const m = new THREE.Mesh(sharedBoxGeo, mat);
    m.position.set(px, py, pz);
    m.scale.set(sx, sy, sz);
    m.castShadow = true;
    m.receiveShadow = true;
    g.add(m);
    return m;
  };

  // Scooter faces +X locally
  // Front & rear tires
  addPart(0.55, 0.20, 0, 0.38, 0.38, 0.16, darkM);
  addPart(-0.52, 0.20, 0, 0.38, 0.38, 0.16, darkM);
  // Floorboard & chassis
  addPart(0.02, 0.26, 0, 0.95, 0.12, 0.34, darkM);
  addPart(-0.35, 0.46, 0, 0.52, 0.28, 0.34, bodyM);
  // Seat cushion
  addPart(-0.28, 0.65, 0, 0.48, 0.10, 0.30, darkM);
  // Front apron & steering stem
  addPart(0.42, 0.56, 0, 0.24, 0.56, 0.30, bodyM);
  addPart(0.40, 0.92, 0, 0.10, 0.24, 0.58, chromeM);
  // Side mirrors
  addPart(0.40, 1.08, -0.26, 0.08, 0.08, 0.08, darkM);
  addPart(0.40, 1.08, 0.26, 0.08, 0.08, 0.08, darkM);

  if (hasDeliveryBox) {
    // Classic yellow Shenzhen food delivery box on back!
    const boxM = new THREE.MeshStandardMaterial({ color: 0xf7be16, roughness: 0.4 });
    addPart(-0.62, 0.92, 0, 0.42, 0.42, 0.42, boxM);
  }

  if (isOn) {
    // Bright headlight & taillight
    const headM = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xfff5cc).multiplyScalar(3.4), toneMapped: false });
    addPart(0.56, 0.72, 0, 0.08, 0.14, 0.16, headM);
    const tailM = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xff2222).multiplyScalar(2.8), toneMapped: false });
    addPart(-0.63, 0.52, 0, 0.06, 0.09, 0.18, tailM);
  } else {
    const offHead = new THREE.MeshStandardMaterial({ color: 0x4b5566, roughness: 0.2 });
    addPart(0.56, 0.72, 0, 0.08, 0.14, 0.16, offHead);
  }

  return g;
}

function buildScooters() {
  // Parked scooters along sidewalks & 24H store
  const parked = [
    { x: -15.2, y: 0.22, z: -3.55, ry: 0.25, col: 0x2675d9, box: false },
    { x: 14.3, y: 0.22, z: 3.7, ry: -2.9, col: 0xeb3f52, box: true },
    { x: 15.8, y: 0.22, z: 3.85, ry: -2.6, col: 0x2cb895, box: false },
    { x: 17.6, y: 0.22, z: -3.65, ry: 3.05, col: 0x454e5e, box: false }
  ];
  for (const s of parked) {
    const m = buildVoxelScooterModel({ bodyColor: s.col, hasDeliveryBox: s.box, isOn: false });
    m.position.set(s.x, s.y, s.z);
    m.rotation.y = s.ry;
    scene.add(m);
  }
  // Charging green LED plug near 24H store scooter
  emissiveCol.addCube(15.8, 0.95, 5.38, 0.08, new THREE.Color(0x22ff77).multiplyScalar(2.4));

  // Moving Scooter 1: Yellow-jacket delivery rider cruising Eastbound along z = +1.05
  {
    const s1 = buildVoxelScooterModel({ bodyColor: 0xf2b705, hasDeliveryBox: true, isOn: true });
    const rider = createVoxelPerson({
      jacketColor: 0xf7c318,
      pantsColor: 0x1b2230,
      hairColor: 0x222630,
      hatColor: 0xf7c318, // yellow delivery helmet!
      seated: true
    });
    rider.root.position.set(-0.22, 0.42, 0);
    s1.add(rider.root);
    // Real moving headlight illuminating wet asphalt & puddle reflections!
    const headLight = new THREE.PointLight(0xffe7a8, 3.2, 6.5, 2.0);
    headLight.position.set(1.1, 0.85, 0);
    s1.add(headLight);
    scene.add(s1);

    animatedScooters.push({
      group: s1,
      update: (t) => {
        // Cruises visibly across the entire market x = -21 -> +21 without grazing close lens!
        const u = ((t + 3.5) % LOOP_DURATION) / LOOP_DURATION;
        let x;
        if (u < 0.60) {
          const p = u / 0.60;
          x = THREE.MathUtils.lerp(-22.0, 22.0, p);
          s1.visible = Math.abs(x) < 20.6;
        } else {
          x = 25;
          s1.visible = false;
        }
        const weave = Math.sin(x * 0.25) * 0.35;
        s1.position.set(x, 0.0, 1.05 + weave);
        s1.rotation.y = -Math.atan2(Math.cos(x * 0.25) * 0.35 * 0.25, 1.0);
        s1.rotation.x = Math.cos(x * 0.25) * 0.05;
      }
    });
  }

  // Moving Scooter 2: Night commuter on cyan-blue scooter cruising Westbound along z = -1.15
  {
    const s2 = buildVoxelScooterModel({ bodyColor: 0x2892d7, hasDeliveryBox: false, isOn: true });
    const rider = createVoxelPerson({
      jacketColor: 0x2f3b54,
      pantsColor: 0x181c26,
      hairColor: 0x141418,
      hatColor: 0xe6edf5, // white scooter helmet
      seated: true
    });
    rider.root.position.set(-0.22, 0.42, 0);
    s2.add(rider.root);
    const headLight = new THREE.PointLight(0xd9f2ff, 2.8, 6.0, 2.0);
    headLight.position.set(1.1, 0.85, 0);
    s2.add(headLight);
    scene.add(s2);

    animatedScooters.push({
      group: s2,
      update: (t) => {
        const u = ((t + 20.0) % LOOP_DURATION) / LOOP_DURATION;
        let x;
        if (u < 0.60) {
          const p = u / 0.60;
          x = THREE.MathUtils.lerp(22.0, -22.0, p);
          s2.visible = Math.abs(x) < 20.6;
        } else {
          x = -25;
          s2.visible = false;
        }
        const weave = Math.sin(x * 0.22 + 1.0) * 0.32;
        s2.position.set(x, 0.0, -1.15 + weave);
        s2.rotation.y = Math.PI + Math.atan2(Math.cos(x * 0.22 + 1.0) * 0.32 * 0.22, 1.0);
      }
    });
  }
}

// 11. VOXEL PEOPLE (EATING, BARGAINING, COOKING, STROLLING WITH UMBRELLAS)
// ============================================================================
function createVoxelPerson({
  skinColor = 0xe8bc96,
  hairColor = 0x181920,
  jacketColor = 0x3b6ea5,
  pantsColor = 0x222836,
  hatColor = null,
  apronColor = null,
  seated = false,
  hasChopsticks = false,
  hasBowl = false,
  hasSpatula = false,
  hasUmbrella = null,
  hasPhone = false
} = {}) {
  const root = new THREE.Group();
  const skinM = new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.72 });
  const hairM = new THREE.MeshStandardMaterial({ color: hairColor, roughness: 0.85 });
  const jacketM = new THREE.MeshStandardMaterial({ color: jacketColor, roughness: 0.75 });
  const pantsM = new THREE.MeshStandardMaterial({ color: pantsColor, roughness: 0.8 });

  const makeBox = (sx, sy, sz, mat) => {
    const m = new THREE.Mesh(sharedBoxGeo, mat);
    m.scale.set(sx, sy, sz);
    m.castShadow = true;
    m.receiveShadow = true;
    return m;
  };

  // Legs
  const legL = new THREE.Group();
  const legR = new THREE.Group();
  const legMeshL = makeBox(0.14, seated ? 0.34 : 0.48, 0.16, pantsM);
  const legMeshR = makeBox(0.14, seated ? 0.34 : 0.48, 0.16, pantsM);
  if (seated) {
    legMeshL.position.set(0.10, -0.14, 0.09);
    legMeshR.position.set(0.10, -0.14, -0.09);
    legL.position.set(0, 0.42, 0);
    legR.position.set(0, 0.42, 0);
  } else {
    legMeshL.position.set(0, -0.24, 0.09);
    legMeshR.position.set(0, -0.24, -0.09);
    legL.position.set(0, 0.48, 0);
    legR.position.set(0, 0.48, 0);
  }
  legL.add(legMeshL);
  legR.add(legMeshR);
  root.add(legL, legR);

  // Torso (faces +X locally)
  const torso = new THREE.Group();
  torso.position.set(0, seated ? 0.44 : 0.48, 0);
  const chest = makeBox(0.24, 0.46, 0.34, jacketM);
  chest.position.set(0, 0.23, 0);
  torso.add(chest);

  if (apronColor) {
    const apron = makeBox(0.06, 0.56, 0.28, new THREE.MeshStandardMaterial({ color: apronColor, roughness: 0.75 }));
    apron.position.set(0.12, 0.14, 0);
    torso.add(apron);
  }

  // Head
  const head = new THREE.Group();
  head.position.set(0, 0.50, 0);
  const skull = makeBox(0.28, 0.28, 0.28, skinM);
  skull.position.set(0, 0.14, 0);
  head.add(skull);

  const hair = makeBox(0.30, 0.12, 0.30, hairM);
  hair.position.set(-0.01, 0.25, 0);
  head.add(hair);
  const backHair = makeBox(0.08, 0.22, 0.30, hairM);
  backHair.position.set(-0.13, 0.16, 0);
  head.add(backHair);

  if (hatColor) {
    const hatM = new THREE.MeshStandardMaterial({ color: hatColor, roughness: 0.55 });
    const hat = makeBox(0.33, 0.15, 0.33, hatM);
    hat.position.set(0.01, 0.27, 0);
    head.add(hat);
    const brim = makeBox(0.14, 0.04, 0.28, hatM);
    brim.position.set(0.17, 0.21, 0);
    head.add(brim);
  }
  torso.add(head);

  // Arms (right = +Z, left = -Z)
  const armR = new THREE.Group();
  armR.position.set(0, 0.40, 0.22);
  const armMeshR = makeBox(0.13, 0.36, 0.13, jacketM);
  armMeshR.position.set(0, -0.15, 0);
  armR.add(armMeshR);

  const armL = new THREE.Group();
  armL.position.set(0, 0.40, -0.22);
  const armMeshL = makeBox(0.13, 0.36, 0.13, jacketM);
  armMeshL.position.set(0, -0.15, 0);
  armL.add(armMeshL);

  if (hasChopsticks) {
    const stick = makeBox(0.24, 0.025, 0.025, new THREE.MeshStandardMaterial({ color: 0xd13838 }));
    stick.position.set(0.14, -0.30, 0);
    armR.add(stick);
  }
  if (hasBowl) {
    const bowl = makeBox(0.18, 0.09, 0.18, new THREE.MeshStandardMaterial({ color: 0xf4f2eb }));
    bowl.position.set(0.12, -0.32, 0.06);
    armL.add(bowl);
  }
  if (hasSpatula) {
    const handle = makeBox(0.34, 0.04, 0.05, new THREE.MeshStandardMaterial({ color: 0x9aa4b5, metalness: 0.7 }));
    handle.position.set(0.20, -0.30, 0);
    armR.add(handle);
  }
  if (hasPhone) {
    const phone = makeBox(0.04, 0.13, 0.08, new THREE.MeshBasicMaterial({ color: new THREE.Color(0x9beaff).multiplyScalar(2.0), toneMapped: false }));
    phone.position.set(0.10, -0.30, 0);
    armR.add(phone);
  }
  if (hasUmbrella) {
    // Keep umbrella pole & canopy strictly upright over head while hand reaches forward to hold grip
    const umbHolder = new THREE.Group();
    umbHolder.position.set(0.18, 0.22, 0.22);
    const pole = makeBox(0.038, 0.88, 0.038, new THREE.MeshStandardMaterial({ color: 0x7b8699 }));
    pole.position.set(0, 0.42, 0);
    umbHolder.add(pole);
    const umbGroup = new THREE.Group();
    umbGroup.position.set(0, 0.88, 0);
    const umbMat = new THREE.MeshStandardMaterial({ color: hasUmbrella, roughness: 0.35 });
    const canopy = makeBox(0.86, 0.08, 0.86, umbMat);
    const canopyTop = makeBox(0.54, 0.07, 0.54, umbMat);
    canopyTop.position.set(0, 0.07, 0);
    umbGroup.add(canopy, canopyTop);
    umbHolder.add(umbGroup);
    torso.add(umbHolder);
  }

  torso.add(armR, armL);
  root.add(torso);
  scene.add(root);

  return { root, torso, head, armL, armR, legL, legR };
}

let steamInstancedMesh = null;
let steamParticles = [];
let dropInstancedMesh = null;
let dropParticles = [];
let sparkInstancedMesh = null;
let sparkParticles = [];

function buildParticleVoxelSystems() {
  const rng = createRng(9912);
  for (const em of animatedSteamEmitters) {
    for (let i = 0; i < em.count; i++) {
      steamParticles.push({
        em,
        seed: i / em.count,
        ox: (rng() - 0.5) * em.spread,
        oz: (rng() - 0.5) * em.spread,
        driftA: rng() * TAU,
        rotSpeed: (rng() - 0.5) * 2.0
      });
    }
  }
  const steamMat = new THREE.MeshStandardMaterial({
    color: 0xeef4ff,
    emissive: 0x455a78,
    emissiveIntensity: 0.38,
    roughness: 0.92,
    transparent: true,
    opacity: 0.36,
    depthWrite: false
  });
  steamInstancedMesh = new THREE.InstancedMesh(sharedBoxGeo, steamMat, steamParticles.length);
  steamInstancedMesh.frustumCulled = false;
  scene.add(steamInstancedMesh);

  // Post-rain drips falling from awning edges directly onto puddle coordinates!
  const dropSpots = [
    { x: -9.5, z: -1.6, topY: 2.52 },
    { x: -2.2, z: 0.8, topY: 4.95 },
    { x: 4.4, z: -1.1, topY: 4.85 },
    { x: 10.8, z: 1.2, topY: 2.50 },
    { x: -14.2, z: 0.4, topY: 4.90 },
    { x: 0.6, z: -2.0, topY: 2.55 }
  ];
  const periods = [2.5, 3.0, 2.5, 3.0, 2.5, 3.0];
  const offsets = [0.2, 1.1, 0.7, 2.1, 1.6, 0.4];
  dropSpots.forEach((ds, idx) => {
    dropParticles.push({ ...ds, period: periods[idx], offset: offsets[idx] });
  });
  const dropMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(0x9ee8ff).multiplyScalar(1.6),
    transparent: true,
    opacity: 0.85,
    toneMapped: false
  });
  dropInstancedMesh = new THREE.InstancedMesh(sharedBoxGeo, dropMat, dropParticles.length);
  scene.add(dropInstancedMesh);

  // Glowing BBQ charcoal ember sparks & Wok sparks!
  for (let i = 0; i < 24; i++) {
    const isWok = i < 8;
    sparkParticles.push({
      x: (isWok ? -10.9 : -1.5) + (rng() - 0.5) * (isWok ? 0.5 : 2.3),
      y: isWok ? 1.65 : 1.32,
      z: (isWok ? -4.2 : -4.2) + (rng() - 0.5) * 0.4,
      seed: i / 24,
      height: 0.9 + rng() * 0.9,
      drift: (rng() - 0.5) * 0.35
    });
  }
  const sparkMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(0xff7722).multiplyScalar(3.2),
    toneMapped: false
  });
  sparkInstancedMesh = new THREE.InstancedMesh(sharedBoxGeo, sparkMat, sparkParticles.length);
  sparkInstancedMesh.frustumCulled = false;
  scene.add(sparkInstancedMesh);
}

    { x: -1.5, y: 7.2, z: -2.5, col: 0xff3864, int: 6.0, dist: 12.5 },
    { x: 7.4, y: 7.2, z: -2.5, col: 0xffbf2e, int: 5.5, dist: 12.0 }
  ];

  for (const pl of poolLights) {
    const light = new THREE.PointLight(pl.col, pl.int, pl.dist, 1.85);
    light.position.set(pl.x, pl.y, pl.z);
    scene.add(light);
    if (pl.flicker) {
      animatedFlickerLights.push({ light, baseInt: pl.int, phase: pl.x * 0.7 });
    }
  }
}

// ============================================================================
// 14. ASSEMBLE SCENE
// ============================================================================
buildDioramaPlinthAndStreet();
buildBuildingsAndArchitecture();
buildNeonAndOverheadWires();
buildAllStalls();
buildPropsAndDetails();
buildScooters();
buildLivingCharacters();
buildParticleVoxelSystems();
buildLights();

// Finalize static instanced meshes
const matteMesh = matteCol.buildInstancedMesh(matteMat);
const metalMesh = metalCol.buildInstancedMesh(metalMat);
const emissiveMesh = emissiveCol.buildInstancedMesh(emissiveMat, { castShadow: false, receiveShadow: false });
const wetGroundMesh = wetGroundCol.buildInstancedMesh(wetGroundMat, {
  castShadow: false,
  receiveShadow: true,
  extraAttrName: 'aWetType'
});
const plinthMesh = plinthCol.buildInstancedMesh(plinthMat, { castShadow: false, receiveShadow: true });

if (matteMesh) scene.add(matteMesh);
if (metalMesh) scene.add(metalMesh);
if (emissiveMesh) scene.add(emissiveMesh);
if (wetGroundMesh) scene.add(wetGroundMesh);
if (plinthMesh) scene.add(plinthMesh);

// ============================================================================
// 15. 30-SECOND SEAMLESS LOOPED CAMERA SPLINE & KEY 'C' FREE-CAM TOGGLE
// ============================================================================
// Carefully cleared collision-free closed spline through the Shenzhen market!
const camWaypoints = [
  new THREE.Vector3(-23.5, 11.8, 17.5), // Hero diorama overview (SW) — open view over low South kiosks!
  new THREE.Vector3(-24.2, 3.2, 0.4),   // Aligned directly in front of the "深圳夜市" archway (zero pillar clip!)
  new THREE.Vector3(-17.8, 2.45, 0.1),  // Thread cleanly under archway into the glowing wet street
  new THREE.Vector3(-10.8, 2.05, 0.35), // Skim low over puddles past Wok Cart flame & approaching scooter
  new THREE.Vector3(-4.2, 2.05, 0.55),  // Close pass past Oyster BBQ, bargaining pair & Dai Pai Dong diners
  new THREE.Vector3(2.8, 2.15, -0.35),  // Pan across seated eaters, Aqua Tanks & Lemon Tea QR stand
  new THREE.Vector3(10.5, 2.45, 0.1),   // Bamboo dim sum steamers, claypot rice, cat & 24H store
  new THREE.Vector3(23.5, 3.2, 0.2),    // Exit cleanly East of corner building & pole before curving out!
  new THREE.Vector3(24.5, 10.4, 11.2),  // Crane upward over East alley overhead wire web
  new THREE.Vector3(13.5, 15.2, 18.8),  // High SE diorama panorama looking down into the full canyon
  new THREE.Vector3(-5.0, 15.6, 19.6)   // High South panorama gliding back smoothly to SW hero start
];

const lookWaypoints = [
  new THREE.Vector3(-1.0, 2.8, -0.6),
  new THREE.Vector3(-8.0, 2.6, 0.0),
  new THREE.Vector3(-5.0, 2.2, -0.5),
  new THREE.Vector3(-7.0, 1.5, -2.5),
  new THREE.Vector3(-1.2, 1.55, -2.1),
  new THREE.Vector3(-2.5, 1.45, 2.8),
  new THREE.Vector3(11.5, 2.2, 0.6),
  new THREE.Vector3(8.0, 2.8, -0.4),
  new THREE.Vector3(1.5, 3.0, -0.6),
  new THREE.Vector3(0.0, 2.6, -0.6),
  new THREE.Vector3(-1.0, 2.8, -0.6)
];

const camCurve = new THREE.CatmullRomCurve3(camWaypoints, true, 'centripetal', 0.5);
const lookCurve = new THREE.CatmullRomCurve3(lookWaypoints, true, 'centripetal', 0.5);

let isFreeCam = false;
let controls = null;
let blendBackAlpha = 1.0;
const blendStartPos = new THREE.Vector3();
const blendStartLook = new THREE.Vector3();
const keysDown = new Set();

function ensureControls() {
  if (!controls) {
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.minDistance = 1.5;
    controls.maxDistance = 58;
    controls.maxPolarAngle = Math.PI * 0.495;
  }
  return controls;
}

window.addEventListener('keydown', (e) => {
  keysDown.add(e.code);
  // KeyC works regardless of active keyboard layout (English 'C' or Russian 'С')
  if (e.code === 'KeyC' && !e.repeat) {
    isFreeCam = !isFreeCam;
    if (isFreeCam) {
      const ctrl = ensureControls();
      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);
      // Place orbit target nicely in front of current view (or at street plane intersection)
      const tPlane = camera.position.y > 0.5 && dir.y < -0.05
        ? Math.min(18, Math.max(4, -camera.position.y / dir.y))
        : 8.0;
      ctrl.target.copy(camera.position).addScaledVector(dir, tPlane);
      ctrl.enabled = true;
      ctrl.update();
    } else {
      if (controls) controls.enabled = false;
      blendBackAlpha = 0.0;
      blendStartPos.copy(camera.position);
      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);
      blendStartLook.copy(camera.position).addScaledVector(dir, 8.0);
    }
  }
});

window.addEventListener('keyup', (e) => {
  keysDown.delete(e.code);
});

// ============================================================================
// 16. ANIMATION LOOP, PLANAR REFLECTION PASS & WINDOW RESIZE
// ============================================================================
const dummy = new THREE.Object3D();
const tmpPos = new THREE.Vector3();
const tmpLook = new THREE.Vector3();
const tmpDir = new THREE.Vector3();

let simTime = 0;
let lastPerf = performance.now();
let frozenTime = null;

function updateSceneAtTime(t) {
  const loopT = ((t % LOOP_DURATION) + LOOP_DURATION) % LOOP_DURATION;
  wetUniforms.uTime.value = loopT;

  // Swaying lanterns (harmonic multiples of 2*pi/30 for seamless loop)
  for (const l of animatedLanterns) {
    l.pivot.rotation.z = Math.sin(loopT * TAU / 5.0 + l.phase) * 0.085;
    l.pivot.rotation.x = Math.cos(loopT * TAU / 7.5 + l.phase * 1.3) * 0.055;
  }

  // Spinning AC fans
  for (const f of animatedFans) {
    f.group.rotation.z = (loopT / LOOP_DURATION) * TAU * f.speed * 4;
  }

  // Flickering wok & grill lights
  for (const fl of animatedFlickerLights) {
    const wave = Math.sin(loopT * TAU / 1.5 + fl.phase) * 0.12
               + Math.sin(loopT * TAU / 0.75 + fl.phase * 2.1) * 0.06;
    fl.light.intensity = fl.baseInt * (1.0 + wave);
  }

  // Custom dynamic groups (wok flame)
  for (const fn of animatedDynamicGroups) fn(loopT);

  // People & moving scooters
  for (const fn of animatedPeople) fn(loopT);
  for (const sc of animatedScooters) sc.update(loopT);

  // Rising voxel steam puffs (exact periodic wrap via fract!) curving out from under awnings
  for (let i = 0; i < steamParticles.length; i++) {
    const p = steamParticles[i];
    const period = 3.0 / p.em.speed;
    const age = ((loopT / period + p.seed) % 1.0 + 1.0) % 1.0;
    const rise = age * p.em.height;
    const outCurve = (p.em.outZ || 0) * Math.sin(Math.min(1, age * 1.4) * Math.PI * 0.5);
    const swirl = Math.sin(age * TAU + p.driftA) * (0.12 + age * 0.22);
    const sz = p.em.baseSize * Math.sin(age * Math.PI) * (0.55 + age * 0.75);
    dummy.position.set(
      p.em.x + p.ox + swirl,
      p.em.y + rise,
      p.em.z + p.oz + outCurve + Math.cos(age * TAU + p.driftA) * 0.10
    );
    dummy.rotation.set(age * p.rotSpeed, age * p.rotSpeed * 1.3, 0);
    dummy.scale.setScalar(Math.max(0.001, sz));
    dummy.updateMatrix();
    steamInstancedMesh.setMatrixAt(i, dummy.matrix);
  }
  steamInstancedMesh.instanceMatrix.needsUpdate = true;

  // Post-rain awning drips synced with puddle ripple rings!
  for (let i = 0; i < dropParticles.length; i++) {
    const d = dropParticles[i];
    const age = (((loopT + d.offset) / d.period) % 1.0 + 1.0) % 1.0;
    // Droplet falls quickly in last 25% before age wraps to 0 (= ripple spawn!)
    if (age > 0.72) {
      const fall = (age - 0.72) / 0.28;
      dummy.position.set(d.x, THREE.MathUtils.lerp(d.topY, 0.02, fall * fall), d.z);
      dummy.scale.set(0.035, 0.09, 0.035);
    } else {
      dummy.position.set(d.x, d.topY, d.z);
      const swell = (age / 0.72) * 0.04;
      dummy.scale.set(swell, swell * 1.2, swell);
    }
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    dropInstancedMesh.setMatrixAt(i, dummy.matrix);
  }
  dropInstancedMesh.instanceMatrix.needsUpdate = true;

  // BBQ & Wok ember sparks
  if (sparkInstancedMesh) {
    for (let i = 0; i < sparkParticles.length; i++) {
      const sp = sparkParticles[i];
      const age = ((loopT / 2.0 + sp.seed) % 1.0 + 1.0) % 1.0;
      const sz = 0.045 * (1.0 - age);
      dummy.position.set(
        sp.x + Math.sin(age * TAU) * 0.08 + sp.drift * age,
        sp.y + age * sp.height,
        sp.z + Math.cos(age * TAU) * 0.08 + age * 0.25
      );
      dummy.scale.setScalar(Math.max(0.001, sz));
      dummy.updateMatrix();
      sparkInstancedMesh.setMatrixAt(i, dummy.matrix);
    }
    sparkInstancedMesh.instanceMatrix.needsUpdate = true;
  }
}

function updateCamera(dt, t) {
  const loopT = ((t % LOOP_DURATION) + LOOP_DURATION) % LOOP_DURATION;
  const u = loopT / LOOP_DURATION;

  if (!isFreeCam) {
    camCurve.getPointAt(u, tmpPos);
    lookCurve.getPointAt(u, tmpLook);
    if (blendBackAlpha < 1.0) {
      blendBackAlpha = Math.min(1.0, blendBackAlpha + dt / 0.8);
      const ease = blendBackAlpha * blendBackAlpha * (3 - 2 * blendBackAlpha);
      camera.position.lerpVectors(blendStartPos, tmpPos, ease);
      const curLook = new THREE.Vector3().lerpVectors(blendStartLook, tmpLook, ease);
      camera.lookAt(curLook);
    } else {
      camera.position.copy(tmpPos);
      camera.lookAt(tmpLook);
    }
  } else if (controls) {
    // Optional gentle WASD fly support while in Free Camera mode
    const moveSpeed = (keysDown.has('ShiftLeft') || keysDown.has('ShiftRight') ? 16 : 8) * dt;
    const fwd = new THREE.Vector3();
    camera.getWorldDirection(fwd);
    const right = new THREE.Vector3().crossVectors(fwd, camera.up).normalize();
    const move = new THREE.Vector3();
    if (keysDown.has('KeyW') || keysDown.has('ArrowUp')) move.add(fwd);
    if (keysDown.has('KeyS') || keysDown.has('ArrowDown')) move.sub(fwd);
    if (keysDown.has('KeyD') || keysDown.has('ArrowRight')) move.add(right);
    if (keysDown.has('KeyA') || keysDown.has('ArrowLeft')) move.sub(right);
    if (keysDown.has('KeyE')) move.y += 1;
    if (keysDown.has('KeyQ')) move.y -= 1;
    if (move.lengthSq() > 0) {
      move.normalize().multiplyScalar(moveSpeed);
      camera.position.add(move);
      controls.target.add(move);
    }
    controls.update();
  }
}

function renderPlanarReflection() {
  wetUniforms.uCamPos.value.copy(camera.position);
  if (camera.position.y <= 0.15) {
    wetUniforms.uReflectEnable.value = 0.0;
    return;
  }
  wetUniforms.uReflectEnable.value = THREE.MathUtils.clamp((camera.position.y - 0.15) * 2.0, 0.0, 1.0);

  camera.getWorldDirection(tmpDir);
  const targetX = camera.position.x + tmpDir.x * 10;
  const targetY = camera.position.y + tmpDir.y * 10;
  const targetZ = camera.position.z + tmpDir.z * 10;

  reflectCamera.fov = camera.fov;
  reflectCamera.aspect = camera.aspect;
  reflectCamera.near = camera.near;
  reflectCamera.far = camera.far;
  reflectCamera.position.set(camera.position.x, -camera.position.y, camera.position.z);
  reflectCamera.up.set(0, 1, 0);
  reflectCamera.lookAt(targetX, -targetY, targetZ);
  reflectCamera.updateMatrixWorld();
  reflectCamera.updateProjectionMatrix();

  reflectMatrix.multiplyMatrices(reflectCamera.projectionMatrix, reflectCamera.matrixWorldInverse);

  // Hide ground & underground plinth during reflection pass so only above-ground lights/stalls reflect
  if (wetGroundMesh) wetGroundMesh.visible = false;
  if (plinthMesh) plinthMesh.visible = false;

  const prevTarget = renderer.getRenderTarget();
  renderer.setRenderTarget(reflectionRT);
  renderer.clear();
  renderer.render(scene, reflectCamera);
  renderer.setRenderTarget(prevTarget);

  if (wetGroundMesh) wetGroundMesh.visible = true;
  if (plinthMesh) plinthMesh.visible = true;
}

function animate(now) {
  requestAnimationFrame(animate);
  const rawDt = Math.max(0.0001, (now - lastPerf) / 1000);
  // Keep exact wall-clock 30s pacing even on slower devices, while ignoring >0.5s tab-switch stalls
  const dt = rawDt > 0.5 ? 0.016 : rawDt;
  lastPerf = now;

  if (frozenTime === null) {
    simTime += dt;
  }
  const activeT = frozenTime !== null ? frozenTime : simTime;

  updateSceneAtTime(activeT);
  updateCamera(dt, activeT);
  renderPlanarReflection();
  composer.render();
}

window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloomPass.setSize(w, h);
  reflectionRT.setSize(Math.max(256, Math.floor(w * 0.5)), Math.max(256, Math.floor(h * 0.5)));
});

// Support optional URL ?t=<seconds> or runtime stepping without adding any visible UI
const urlT = new URLSearchParams(window.location.search).get('t');
if (urlT !== null && !Number.isNaN(parseFloat(urlT))) {
  frozenTime = parseFloat(urlT);
}
window.__diorama = {
  setTime: (sec) => { frozenTime = sec; },
  resume: () => { frozenTime = null; },
  getState: () => ({ isFreeCam, camPos: camera.position.toArray(), loopT: (frozenTime ?? simTime) % LOOP_DURATION })
};

requestAnimationFrame(animate);
</script>
